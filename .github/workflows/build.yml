name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version tag (e.g. v1.0.3)'
        required: false

# ── 并发控制：同一分支新提交自动取消旧运行 ──
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.27.x'

# ── 共享步骤：跨平台一致的 Flutter 初始化 ──
#
# 使用 YAML 锚点避免重复，但注意 composite 级别的锚点在不同 job 间不共享
# （每个 job 有自己的 `steps`），所以这里只在同 job 内部用锚点。

jobs:
  ##############################################################################
  #  Version Detection  ── 一劳永逸算出版本号
  ##############################################################################
  version:
    name: Detect version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      number: ${{ steps.v.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          # 优先用 workflow_dispatch 传入的版本
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "number=${tag#v}" >> "$GITHUB_OUTPUT"
          # GitHub Release tag 触发
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          # 从 pubspec.yaml 读取
          else
            VER=$(grep '^version: ' pubspec.yaml | sed 's/version: //')
            echo "tag=v$VER" >> "$GITHUB_OUTPUT"
            echo "number=$VER" >> "$GITHUB_OUTPUT"
          fi

  ##############################################################################
  #  Android  (ubuntu + Java + NDK)
  ##############################################################################
  android:
    name: 📱 Android APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/27.0.12077973
          key: ndk-27.0.12077973-${{ runner.os }}

      - name: Install cmake & NDK & licenses
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          if [ "${{ steps.cache-ndk.outputs.cache-hit }}" != "true" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" > /dev/null 2>&1
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Create release keystore (from secrets)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo '${{ secrets.KEYSTORE_BASE64 }}' | base64 -d > publish.keystore
            echo 'storePassword=${{ secrets.STORE_PASSWORD }}' >> android/key.properties
            echo 'keyPassword=${{ secrets.KEY_PASSWORD }}' >> android/key.properties
            echo 'keyAlias=${{ secrets.KEY_ALIAS }}' >> android/key.properties
            echo 'storeFile=../../publish.keystore' >> android/key.properties
          else
            echo "No keystore secrets set — building with debug signing"
          fi

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Build universal APK (reuses cached compilation)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Package & rename APKs
        run: |
          VER=${{ needs.version.outputs.tag }}
          mkdir -p output
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            f=$(basename "$apk")
            case "$f" in
              app-armeabi-v7a-release.apk)   out="Chess-Flutter-${VER}-arm32.apk" ;;
              app-arm64-v8a-release.apk)     out="Chess-Flutter-${VER}-arm64.apk" ;;
              app-x86_64-release.apk)        out="Chess-Flutter-${VER}-x86_64.apk" ;;
              app-release.apk)               out="Chess-Flutter-${VER}-universal.apk" ;;
              *)                             continue ;;
            esac
            cp "$apk" "output/$out"
          done
          ls -lh output/

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: android-universal-${{ needs.version.outputs.tag }}
          path: output/Chess-Flutter-${{ needs.version.outputs.tag }}-universal.apk
          compression-level: 0
          retention-days: 30

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-${{ needs.version.outputs.tag }}
          path: output/Chess-Flutter-${{ needs.version.outputs.tag }}-arm64.apk
          compression-level: 0
          retention-days: 30

      - name: Upload arm32 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-arm32-${{ needs.version.outputs.tag }}
          path: output/Chess-Flutter-${{ needs.version.outputs.tag }}-arm32.apk
          compression-level: 0
          retention-days: 30

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-x86_64-${{ needs.version.outputs.tag }}
          path: output/Chess-Flutter-${{ needs.version.outputs.tag }}-x86_64.apk
          compression-level: 0
          retention-days: 30

  ##############################################################################
  #  Ubuntu Matrix  ── Web + Linux
  ##############################################################################
  ubuntu-builds:
    name: ${{ matrix.target.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: 🌐 Web (PWA)
            build: flutter build web --release --no-tree-shake-icons
            upload: web-pwa-${{ needs.version.outputs.tag }}
            path: dist/Chess-Flutter-${{ needs.version.outputs.tag }}-web.zip
            pkg: |
              mkdir -p dist
              cd build/web && zip -qr "../../dist/Chess-Flutter-${{ needs.version.outputs.tag }}-web.zip" .
          - name: 🐧 Linux (x64)
            build: |
              sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build libgtk-3-dev
              flutter build linux --release
            upload: linux-x64-${{ needs.version.outputs.tag }}
            path: dist/Chess-Flutter-${{ needs.version.outputs.tag }}-linux-x64.tar.gz
            pkg: |
              # Strip 剥离调试符号
              strip build/linux/x64/release/bundle/chess_app 2>/dev/null || true
              # tar.gz 打包（比 ZIP 更小）
              mkdir -p dist
              tar czf dist/Chess-Flutter-${{ needs.version.outputs.tag }}-linux-x64.tar.gz \
                -C build/linux/x64/release/bundle/ .
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build
        run: ${{ matrix.target.build }}

      - name: Package
        if: "matrix.target.pkg != ''"
        run: ${{ matrix.target.pkg }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.upload }}
          path: ${{ matrix.target.path }}
          compression-level: 0
          retention-days: 30

  ##############################################################################
  #  Windows  (windows-latest)
  ##############################################################################
  windows:
    name: 🪟 Windows (x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: |
          # Flutter 3.27 不识别 VS 2025，硬编码 VS 2019 作为 cmake generator。
          # 解法：在 Flutter 生成配置后，手动调用 cmake 覆盖 generator。
          
          # 第一步：触发 Flutter 生成配置（会失败，但 generated_config 和 build/windows 就绪）
          flutter build windows --release 2>&1 | Out-Null
          
          # 第二步：修正 config 中的 generator
          $config = "windows\flutter\ephemeral\generated_config.cmake"
          (Get-Content $config) -replace 'Visual Studio 16 2019','Visual Studio 17 2022' | Set-Content $config
          
          # 第三步：手动 cmake（将缓存中 generator 也覆盖掉）
          cmake -S windows -B build/windows `
            -C windows/flutter/ephemeral/generated_config.cmake `
            -G "Visual Studio 17 2022" -A x64
          
          # 第四步：手动 build
          cmake --build build/windows --config Release

      - name: Package with ZIP
        run: |
          Compress-Archive -Path build/windows/runner/Release/* -DestinationPath Chess-Flutter-${{ needs.version.outputs.tag }}-windows-x64.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ needs.version.outputs.tag }}
          path: Chess-Flutter-${{ needs.version.outputs.tag }}-windows-x64.zip
          compression-level: 0
          retention-days: 30

  ##############################################################################
  #  macOS + iOS  (macos-latest 共享，顺序执行以复用 Flutter 缓存)
  ##############################################################################
  apple-builds:
    name: ${{ matrix.target.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: 🍎 macOS (x64)
            build: flutter build macos --release
            upload: macos-x64-${{ needs.version.outputs.tag }}
            path: dist/弈-${{ needs.version.outputs.tag }}-macos.zip
            pkg: |
              APP=build/macos/Build/Products/Release/chess_app.app
              # Strip debug symbols
              strip -S "${APP}/Contents/MacOS/chess_app" 2>/dev/null || true
              mkdir -p dist
              ditto -c -k --keepParent "$APP" "dist/弈-${{ needs.version.outputs.tag }}-macos.zip"
          - name: 📱 iOS (arm64)
            build: |
              cd ios && pod install && cd ..
              flutter build ios --release --no-codesign
            upload: ios-arm64-${{ needs.version.outputs.tag }}
            path: dist/弈-${{ needs.version.outputs.tag }}-ios.ipa
            pkg: |
              # 无签名构建，产出 unsigned .ipa（可用 sideloadly / AltStore 安装）
              mkdir -p dist/Payload
              cp -r build/ios/iphoneos/Runner.app dist/Payload/
              cd dist && zip -qr "弈-${{ needs.version.outputs.tag }}-ios.ipa" Payload/
              rm -rf Payload
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build & Package
        run: |
          ${{ matrix.target.build }}
          ${{ matrix.target.pkg }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.upload }}
          path: ${{ matrix.target.path }}
          compression-level: 0
          retention-days: 30
